name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # NOTE: gradle-wrapper.jar is a binary artifact. GitHub-hosted ubuntu-latest
      # runners ship with a system Gradle install and full internet access, so we
      # use it here to (re)generate a correct, verified wrapper (gradlew,
      # gradlew.bat, gradle-wrapper.jar) that exactly matches the Gradle version
      # pinned in gradle/wrapper/gradle-wrapper.properties. This runs automatically
      # on every build — no manual setup required from the repo owner.
      - name: Generate / refresh Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7 --distribution-type all

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: raktar-kereso-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
